<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Kaboom — le Bomberman de la pause de midi</title>
  <meta name="description" content="Kaboom : un remake multijoueur de Bomberman jouable en 2 clics. Cree une room, partage le lien, dernier vivant gagne. Les morts reviennent en fantomes vengeurs.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%A3%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="toast" hidden></div>
  <div id="errbar" hidden></div>
  <button id="soundBtn" class="soundtoggle" title="son"></button>

  <!-- ACCUEIL -->
  <section id="home" class="screen">
    <header class="brand">
      <h1><span class="boom">💣</span> Kaboom</h1>
      <p class="tagline" data-i18n="tagline"></p>
      <p class="legend" data-i18n="legend"></p>
    </header>

    <div class="card">
      <label class="field">
        <span data-i18n="nick"></span>
        <input id="name" maxlength="16" data-i18n-ph="nickPh" autocomplete="off">
      </label>
      <div class="theme-row">
        <span data-i18n="theme"></span>
        <div id="themePicker" class="chips"></div>
      </div>
      <div class="theme-row">
        <span data-i18n="lang"></span>
        <div id="langPicker" class="chips"></div>
      </div>
    </div>

    <div class="cols">
      <div class="card">
        <h2 data-i18n="createTitle"></h2>
        <label class="field"><span data-i18n="roomName"></span>
          <input id="roomName" maxlength="24" data-i18n-ph="roomNamePh" autocomplete="off"></label>
        <label class="field"><span data-i18n="maxPlayers"></span>
          <select id="maxPlayers">
            <option>2</option><option>3</option><option selected>4</option>
            <option>5</option><option>6</option><option>8</option>
          </select></label>
        <label class="field"><span data-i18n="mapSize"></span>
          <select id="mapSize">
            <option value="auto" data-i18n="sizeAuto" selected></option>
            <option value="s" data-i18n="sizeS"></option>
            <option value="m" data-i18n="sizeM"></option>
            <option value="l" data-i18n="sizeL"></option>
            <option value="xl" data-i18n="sizeXL"></option>
          </select></label>
        <label class="check"><input type="checkbox" id="isPrivate"> <span data-i18n="private"></span></label>
        <button id="createBtn" class="primary" data-i18n="createBtn"></button>
      </div>

      <div class="card">
        <h2 data-i18n="joinTitle"></h2>
        <div class="join-row">
          <input id="joinCode" maxlength="4" data-i18n-ph="joinPh" autocomplete="off" style="text-transform:uppercase">
          <button id="joinBtn" data-i18n="joinBtn"></button>
        </div>
        <h3 data-i18n="publicGames"></h3>
        <div id="rooms" class="rooms"></div>
      </div>
    </div>
    <footer class="foot">
      <span id="connDot" class="conn"></span>
      <span data-i18n="footA"></span>
      <a href="https://stranix.net" target="_blank" rel="noopener">stranix.net</a>
      <span data-i18n="footB"></span>
      <a href="https://code79.com" target="_blank" rel="noopener">code79</a>
    </footer>
  </section>

  <!-- LOBBY -->
  <section id="lobby" class="screen" hidden>
    <div class="card lobby-card">
      <h2 id="lobbyName">Arène</h2>
      <p class="code"><span data-i18n="codeLabel"></span> <b id="lobbyCode">----</b></p>
      <p class="muted" id="lobbySize"></p>
      <p id="lobbyResult" class="result" hidden></p>
      <div class="share">
        <input id="shareLink" readonly>
        <button id="copyLink" data-i18n="copy"></button>
      </div>
      <h3 data-i18n="players"></h3>
      <div id="lobbyPlayers" class="lobby-players"></div>
      <div class="lobby-actions">
        <button id="startBtn" class="primary"></button>
        <button id="leaveBtn" data-i18n="leave"></button>
      </div>
      <div class="chat">
        <div id="chatLog" class="chatlog"></div>
        <div class="chat-row">
          <button id="emojiBtn" class="emoji-btn" title="emoji">😀</button>
          <input id="chatInput" maxlength="200" data-i18n-ph="chatPh" autocomplete="off">
          <button id="chatSend">➤</button>
        </div>
        <div id="emojiBar" class="emoji-bar" hidden></div>
      </div>
      <p class="muted" data-i18n="lobbyTip"></p>
    </div>
  </section>

  <!-- JEU -->
  <section id="game" class="screen" hidden>
    <div class="hud">
      <button id="quitBtn" class="hudbtn"><span aria-hidden="true">⤺</span> <span data-i18n="quit"></span></button>
      <span id="hudAlive">—</span>
      <span id="hudTimer">—</span>
      <span id="hudStats"></span>
      <button id="tauntBtn" class="iconbtn" title="taunt (L)">😈</button>
    </div>
    <div id="tauntOverlay" class="taunt-overlay" hidden></div>
    <div class="arena-wrap">
      <canvas id="canvas"></canvas>
      <div id="overlay" class="overlay" hidden>
        <h2 id="overTitle"></h2>
        <p id="overSub"></p>
      </div>
    </div>
    <div class="touch">
      <div class="dpad">
        <button id="padUp">▲</button>
        <div class="dpad-mid">
          <button id="padLeft">◀</button>
          <button id="padRight">▶</button>
        </div>
        <button id="padDown">▼</button>
      </div>
      <button id="padBomb" class="bomb-btn">💣</button>
    </div>
    <p class="controls-hint" data-i18n="hint"></p>
  </section>

  <div id="version" class="version"></div>
  <script type="module" src="/client.js"></script>
</body>
</html>
