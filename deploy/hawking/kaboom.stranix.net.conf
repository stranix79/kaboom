# kaboom.stranix.net — le jeu Kaboom (serveur Node + WebSocket, conteneur kaboom:3000).
# A copier dans /opt/stranix-git/docker-compose/hawking/shared/nginx/conf.d/ sur hawking.
# Cert Let's Encrypt (cert-name "kaboom.stranix.net"), renouvele par ghost_certbot.

# HTTP : challenge ACME + redirection HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name kaboom.stranix.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kaboom.stranix.net;

    ssl_certificate /etc/letsencrypt/live/kaboom.stranix.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaboom.stranix.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_kaboom:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/kaboom.stranix.net.access.log;
    error_log  /var/log/nginx/kaboom.stranix.net.error.log warn;

    location / {
        proxy_pass http://kaboom:3000;
        proxy_http_version 1.1;
        # WebSocket (le jeu ne fonctionne pas sans ces deux en-tetes)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;   # garde les parties en cours connectees
    }
}
