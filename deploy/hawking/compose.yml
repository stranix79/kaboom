# Deploiement Kaboom sur hawking.
# Le conteneur ecoute en interne sur 3000 (pas de port hote) ; ghost_nginx le joint
# via le DNS Docker (http://kaboom:3000) et publie kaboom.stranix.net en HTTPS.
# Deploiement : GIT_SHA=$(git rev-parse --short HEAD) docker compose -f deploy/hawking/compose.yml up -d --build
services:
  kaboom:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: kaboom:latest
    container_name: kaboom
    restart: unless-stopped
    environment:
      - PORT=3000
    expose:
      - "3000"
    networks:
      - ghost

# Reseau public partage avec ghost_nginx sur hawking.
networks:
  ghost:
    external: true
    name: stranixnet_ghost_external
